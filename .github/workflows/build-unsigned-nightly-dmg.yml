name: Build unsigned ARM64 Nightly DMG

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unsigned-nightly-dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish macOS ARM64 DMG
    runs-on: macos-15
    timeout-minutes: 45
    env:
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=t3...
              - --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      # These are public client identifiers, not secrets. This keeps T3 Connect
      # enabled in fork builds in the same way as a local source build.
      - name: Configure public T3 services
        run: cp .env.example .env.local

      - id: nightly
        name: Resolve Nightly version
        shell: bash
        run: |
          nightly_date="$(date -u +%Y%m%d)"

          node scripts/resolve-nightly-release.ts \
            --date "$nightly_date" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --sha "$GITHUB_SHA" \
            --github-output

      - name: Align package versions
        run: |
          node scripts/update-release-package-versions.ts \
            "${{ steps.nightly.outputs.version }}"

      - name: Build unsigned ARM64 DMG
        run: |
          vp run dist:desktop:artifact \
            --platform mac \
            --target dmg \
            --arch arm64 \
            --build-version "${{ steps.nightly.outputs.version }}" \
            --verbose

      - name: Verify DMG
        shell: bash
        run: |
          shopt -s nullglob
          dmgs=(release/*.dmg)

          if (( ${#dmgs[@]} != 1 )); then
            echo "Expected exactly one DMG, found ${#dmgs[@]}." >&2
            exit 1
          fi

          hdiutil verify "${dmgs[0]}"

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.nightly.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.nightly.outputs.name }}
          body: |
            Unsigned personal ARM64 Nightly build from `${{ github.sha }}`.

            On first launch, right-click **T3 Code (Nightly)** and choose **Open**.
          prerelease: true
          make_latest: false
          files: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/*.yml
          fail_on_unmatched_files: true
          token: ${{ github.token }}
